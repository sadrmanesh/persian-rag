name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EXTRAS: dev,server,qdrant,pgvector,pdf,docx

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[${EXTRAS}]"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests on Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [extras]
        include:
          - python-version: "3.10"
            deps: minimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (minimal)
        if: matrix.deps == 'minimal'
        run: python -m pip install -e ".[dev]"
      - name: Install (with extras)
        if: matrix.deps == 'extras'
        run: python -m pip install -e ".[${EXTRAS}]"
      - name: Pytest
        run: pytest

  postgres:
    name: pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: persian_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PERSIAN_RAG_PG_DSN: postgresql://postgres@localhost:5432/persian_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,pgvector]"
      - name: Pytest (pgvector)
        run: pytest -m postgres -rs

  search:
    name: Elasticsearch and OpenSearch integration
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      PERSIAN_RAG_ES_URL: http://localhost:9200
      PERSIAN_RAG_OPENSEARCH_URL: http://localhost:9201
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest (search)
        run: pytest -m search -rs

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[docs]"
      - name: Build
        run: mkdocs build --strict

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t persian-rag:ci .
      - name: Index a sample document
        run: |
          mkdir -p "$RUNNER_TEMP/library" "$RUNNER_TEMP/data"
          chmod 777 "$RUNNER_TEMP/data"
          printf 'حافظ شاعر بزرگ ایرانی در شیراز به دنیا آمد.\n' > "$RUNNER_TEMP/library/hafez.txt"
          docker run --rm \
            -v "$RUNNER_TEMP/library:/library:ro" \
            -v "$RUNNER_TEMP/data:/data" \
            persian-rag:ci ingest /library --index /data/index
      - name: Smoke test the HTTP API
        run: |
          docker run -d --name rag -p 127.0.0.1:8000:8000 -v "$RUNNER_TEMP/data:/data" persian-rag:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status"'
          curl -fsS http://127.0.0.1:8000/retrieve -H 'content-type: application/json' \
            -d '{"query": "حافظ کجا به دنیا آمد؟", "k": 1}' | grep -q hafez
          for i in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' rag)"
            echo "health: ${state}"
            if [ "${state}" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          docker logs rag
          exit 1
      - name: Server logs
        if: failure()
        run: docker logs rag || true
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id persian-rag:ci -u)" != "0"
