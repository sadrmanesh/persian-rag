name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EXTRAS: dev,server,qdrant,pgvector,pdf,docx

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[${EXTRAS}]"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Mypy
        run: mypy src

  test:
    name: Tests on Python ${{ matrix.python-version }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [extras]
        include:
          - python-version: "3.10"
            deps: minimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (minimal)
        if: matrix.deps == 'minimal'
        run: python -m pip install -e ".[dev]"
      - name: Install (with extras)
        if: matrix.deps == 'extras'
        run: python -m pip install -e ".[${EXTRAS}]"
      - name: Pytest
        run: pytest

  postgres:
    name: pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: persian_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PERSIAN_RAG_PG_DSN: postgresql://postgres@localhost:5432/persian_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,pgvector]"
      - name: Pytest (pgvector)
        run: pytest -m postgres -rs

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[docs]"
      - name: Build
        run: mkdocs build --strict

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
