[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "persian-rag"
version = "0.2.0"
description = "Persian-first retrieval-augmented generation toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Naser Sadrmanesh", email = "info.sadrmanesh@gmail.com" }]
maintainers = [{ name = "Naser Sadrmanesh", email = "info.sadrmanesh@gmail.com" }]
keywords = [
    "persian",
    "farsi",
    "rag",
    "retrieval",
    "nlp",
    "embeddings",
    "bm25",
    "reranking",
    "qdrant",
    "pgvector",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
sentence-transformers = ["sentence-transformers>=3.0.0"]
rerank = ["sentence-transformers>=3.0.0"]
faiss = ["faiss-cpu>=1.8.0", "numpy>=1.26.0"]
qdrant = ["qdrant-client>=1.10.0"]
pgvector = ["psycopg[binary]>=3.1.0"]
pdf = ["pypdf>=4.0.0"]
docx = ["python-docx>=1.1.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
all = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.10.0",
    "psycopg[binary]>=3.1.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
dev = ["pytest>=8.2.0", "ruff>=0.6.0", "mypy>=1.11.0", "httpx>=0.27.0"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0", "mkdocs-static-i18n>=1.2.0"]

[project.urls]
Homepage = "https://github.com/sadrmanesh/persian-rag"
Repository = "https://github.com/sadrmanesh/persian-rag"
Documentation = "https://sadrmanesh.github.io/persian-rag/"
Changelog = "https://github.com/sadrmanesh/persian-rag/blob/main/CHANGELOG.md"
Author = "https://sadrmanesh.github.io"

[project.scripts]
persian-rag = "persian_rag.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "src/persian_rag",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "docs",
    "mkdocs.yml",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Persian letters and punctuation are intentional, including confusables such as
# Arabic yeh/kaf and the Arabic full stop.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["persian_rag"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["persian_rag"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "numpy",
    "numpy.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "qdrant_client",
    "qdrant_client.*",
    "psycopg",
    "psycopg.*",
    "pypdf",
    "pypdf.*",
    "docx",
    "docx.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "heavy: tests that download or load large models (set PERSIAN_RAG_RUN_HEAVY=1)",
    "postgres: tests that need PostgreSQL with pgvector (set PERSIAN_RAG_PG_DSN)",
]
